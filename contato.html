<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Yeda Maria</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <nav class="cabecalho_menu">
            <a class="cabecalho_menu_link" href="index.html">Início</a>
            <a class="cabecalho_menu_link" href="about.html">Minha trajetória</a>
            <a class="cabecalho_menu_link ativo" href="contato.html">Contato</a>
        </nav>
    </header>

    <!-- SEÇÃO DE CONTATO -->
    <section class="contato">
        <h1 class="contato_titulo">Vamos Conversar</h1>

        <div class="contato_container">
            <!-- FORMULÁRIO -->
            <form class="formulario" action="https://formspree.io/f/xnjbobbp" method="POST">
                <div class="formulario_grupo">
                    <label for="nome" class="formulario_label">Seu Nome</label>
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome" 
                        class="formulario_input" 
                        placeholder="Como você se chama?"
                        required
                    >
                </div>

                <div class="formulario_grupo">
                    <label for="email" class="formulario_label">Seu Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="formulario_input" 
                        placeholder="seu@email.com"
                        required
                    >
                </div>

                <div class="formulario_grupo">
                    <label for="assunto" class="formulario_label">Assunto</label>
                    <input 
                        type="text" 
                        id="assunto" 
                        name="assunto" 
                        class="formulario_input" 
                        placeholder="Do que você quer falar?"
                        required
                    >
                </div>

                <div class="formulario_grupo">
                    <label for="mensagem" class="formulario_label">Sua Mensagem</label>
                    <textarea 
                        id="mensagem" 
                        name="mensagem" 
                        class="formulario_textarea" 
                        placeholder="Conte-me mais sobre seu projeto..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="formulario_botao">Enviar Mensagem</button>
            </form>

            <!-- INFORMAÇÕES DE CONTATO -->
            <div class="contato_info">
                <h3 class="contato_info_titulo">Outras Formas de Contato</h3>

                <!-- EMAIL -->
                <div class="contato_info_item">
                    <div class="contato_info_item_titulo">📧 Email</div>
                    <div class="contato_info_item_texto">
                        <a href="mariaiedarios@hotmail.com" class="contato_info_item_link">mariaiedarios@hotmail.com</a>
                    </div>
                </div>

                <!-- TELEFONE -->
                <div class="contato_info_item">
                    <div class="contato_info_item_titulo">📱 Telefone</div>
                    <div class="contato_info_item_texto">
                        <a href="tel:+5571996590916" class="contato_info_item_link">71 9 9659-0916 </a>
                    </div>
                </div>

                <!-- LOCALIZAÇÃO -->
                <div class="contato_info_item">
                    <div class="contato_info_item_titulo">📍 Localização</div>
                    <div class="contato_info_item_texto">
                        Aracaju, Sergipe, Brasil. <style> .contato_info_item_texto { color: var(--cor-primaria); } </style>
                    </div>
                </div>

                <!-- REDES SOCIAIS -->
                <div class="contato_info_item">
                    <div class="contato_info_item_titulo">🌐 Redes Sociais</div>
                    <div class="icon-buttons" style="margin-top: 12px;">
                        <a href="https://instagram.com/yeda._._._" target="_blank" class="btn-icon btn-icon-instagram" title="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://www.linkedin.com/in/yeda-rios-5b2994272/" target="_blank" class="btn-icon btn-icon-linkedin" title="LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a href="https://github.com/dedadevye" target="_blank" class="btn-icon btn-icon-github" title="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <p>Desenvolvido por Yeda Maria</p>
    </footer>

    <script>
        // Script para validação básica do formulário
        const formulario = document.querySelector('.formulario' );
        
        formulario.addEventListener('submit', function(e) {
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const assunto = document.getElementById('assunto').value.trim();
            const mensagem = document.getElementById('mensagem').value.trim();

            if (!nome || !email || !assunto || !mensagem) {
                e.preventDefault();
                alert('Por favor, preencha todos os campos!');
            }
        });
    </script>
</body>
</html>
